<svg
    xmlns="http://www.w3.org/2000/svg" width="136" height="20" role="img" aria-label="Заголовок: Значение">
    <title>Заголовок: Значение</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="136" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect fill="#555" width="70" height="20"/>
        <rect fill="#007ec6" x="70" width="66" height="20"/>
        <rect fill="url(#s)" width="136" height="20"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
        <image x="5" y="3" width="14" height="14" href=""/>
        <text aria-hidden="true" x="350" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="600">Заголовок</text>
        <text x="350" y="140" fill="#fff" transform="scale(.1)" textLength="600">Заголовок</text>
        <text aria-hidden="true" x="1030" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="560">Значение</text>
        <text x="1030" y="140" fill="#fff" transform="scale(.1)" textLength="560">Значение</text>
    </g>
</svg>