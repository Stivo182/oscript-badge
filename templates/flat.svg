<svg
    xmlns="http://www.w3.org/2000/svg" width="{{ Ширина }}" height="20" role="img" aria-label="{{ Подсказка }}">
    <title>{{ Подсказка }}</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="{{ Ширина }}" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect fill="{{ ЦветФонаЗаголовка }}" width="{{ ПозицияРазделения }}" height="20"/>
        <rect fill="{{ ЦветФонаЗначения }}" x="{{ ПозицияРазделения }}" width="{{ ШиринаЗначения }}" height="20"/>
        <rect fill="url(#s)" width="{{ Ширина }}" height="20"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="{{ РазмерШрифта }}">
        <image x="{{ ОтступЛоготипа }}" y="3" width="{{ ШиринаЛоготипа }}" height="14" href="{{ Логотип }}"/>
        <text aria-hidden="true" x="{{ ПозицияЗаголовка }}" y="150" fill="{{ ЦветТениЗаголовка }}" fill-opacity=".3" transform="scale(.1)" textLength="{{ ШиринаТекстаЗаголовка }}">{{ Заголовок }}</text>
        <text x="{{ ПозицияЗаголовка }}" y="140" fill="{{ ЦветТекстаЗаголовка }}" transform="scale(.1)" textLength="{{ ШиринаТекстаЗаголовка }}">{{ Заголовок }}</text>
        <text aria-hidden="true" x="{{ ПозицияЗначения }}" y="150" fill="{{ ЦветТениЗначения }}" fill-opacity=".3" transform="scale(.1)" textLength="{{ ШиринаТекстаЗначения }}">{{ Значение }}</text>
        <text x="{{ ПозицияЗначения }}" y="140" fill="{{ ЦветТекстаЗначения }}" transform="scale(.1)" textLength="{{ ШиринаТекстаЗначения }}">{{ Значение }}</text>
    </g>
</svg>