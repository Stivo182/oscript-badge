<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="{{ Ширина }}" height="20">
    <linearGradient id="b" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <mask id="r">
        <rect width="{{ Ширина }}" height="20" rx="10" fill="#fff"/>
    </mask>
    <g mask="url(#r)">
        <rect fill="{{ ЦветФонаЗаголовка }}" x="0" y="0" width="{{ Ширина }}" height="20"/>
        <rect fill="{{ ЦветФонаЗначения }}" x="{{ ПозицияРазделения }}" y="2" width="{{ Макс(ШиринаЗначения - 10, 0) }}" height="16"/>
        <rect fill="{{ ЦветФонаЗначения }}" x="{{ Макс(Ширина - 17, 0) }}" y="2" width="{{ ?(ШиринаЗначения > 0, 15, 0) }}" height="16" rx="10"/>
        <rect fill="url(#b)" x="0" y="0" width="{{ Ширина }}" height="20"/>
    </g>
    <g fill="{{ ЦветТекстаЗаголовка }}" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="{{ РазмерШрифта }}">
        <text x="{{ ПозицияЗаголовка }}" y="140" transform="scale(.1)" textLength="{{ ДлинаТекстаЗаголовка }}">{{ Заголовок }}</text>
    </g>
    <g fill="{{ ЦветТекстаЗначения }}" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="{{ РазмерШрифта }}">
        <text x="{{ ПозицияЗначения - 10 }}" y="140" transform="scale(.1)" textLength="{{ ДлинаТекстаЗначения }}">{{ Значение }}</text>
    </g>
</svg>