<svg
	xmlns="http://www.w3.org/2000/svg" width="{{ Ширина }}" height="28" role="img" aria-label="{{ Подсказка }}">
	<title>{{ Подсказка }}</title>
	<g shape-rendering="crispEdges">
		<rect width="{{ ПозицияРазделения }}" height="28" fill="{{ ЦветФонаЗаголовка }}"/>
		<rect x="{{ ПозицияРазделения }}" width="{{ ШиринаЗначения }}" height="28" fill="{{ ЦветФонаЗначения }}"/>
	</g>
	<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="{{ РазмерШрифта }}">
		<image x="9" y="7" width="14" height="14" href="{{ Логотип }}"/>
		<text transform="scale(.1)" x="{{ ПозицияЗаголовка }}" y="175" fill="{{ ЦветТекстаЗаголовка }}" textLength="{{ ДлинаТекстаЗаголовка }}">{{ Заголовок }}</text>
		<text transform="scale(.1)" x="{{ ПозицияЗначения }}" y="175" fill="{{ ЦветТекстаЗначения }}" textLength="{{ ДлинаТекстаЗначения }}" font-weight="bold">{{ Значение }}</text>
	</g>
</svg>