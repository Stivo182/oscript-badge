<svg
    xmlns="http://www.w3.org/2000/svg" width="{{ Ширина }}" height="20" aria-label="{{ Подсказка }}">
    <title>{{ Подсказка }}</title>
    <style>
        a:hover #llink{fill:url(#b);stroke:#ccc}
        a:hover #rlink{fill:#4183c4}
        a[href=""], a:not([href]) { pointer-events: none; cursor: default; }
    </style>
    <linearGradient id="a" x2="0" y2="100%">
        <stop offset="0" stop-color="#fcfcfc" stop-opacity="0"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="b" x2="0" y2="100%">
        <stop offset="0" stop-color="#ccc" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <g stroke="#d5d5d5">
        <rect stroke="none" fill="#fcfcfc" x="0.5" y="0.5" width="{{ ПозицияРазделения }}" height="19" rx="2"/>
        <rect x="{{ ПозицияРазделения + 6.5 }}" y="0.5" width="{{ Макс(ШиринаЗначения - 0.5, 0) }}" height="19" rx="2" fill="#fafafa"/>
        <rect x="{{ ПозицияРазделения + 6 }}" y="7.5" width="0.5" height="5" stroke="#fafafa"/>
        <path d="M{{ ПозицияРазделения + 6.5 }} 6.5 l-3 3v1 l3 3" fill="#fafafa"/>
    </g>
    <image x="5" y="3" width="14" height="14" href="{{ Логотип }}"/>
    <g aria-hidden="false" fill="#333" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" text-rendering="geometricPrecision" font-weight="700" font-size="{{ РазмерШрифта }}" line-height="14px">
        <a target="_blank" href="{{ СсылкаЗаголовка }}">
            <text aria-hidden="true" x="{{ ПозицияЗаголовка }}" y="150" fill="#fff" transform="scale(.1)" textLength="{{ ШиринаТекстаЗаголовка }}">{{ Заголовок }}</text>
            <text x="{{ ПозицияЗаголовка }}" y="140" transform="scale(.1)" textLength="{{ ШиринаТекстаЗаголовка }}">{{ Заголовок }}</text>
            <rect id="llink" stroke="#d5d5d5" fill="url(#a)" x=".5" y=".5" width="{{ Макс(ШиринаОбластиЛоготипа + ШиринаЗаголовка - 1, 0) }}" height="19" rx="2"/>
        </a>
        <a target="_blank" href="{{ СсылкаЗначения }}">
            <rect width="{{ ПозицияРазделения + 1 }}" x="{{ ПозицияРазделения + 6 }}" height="20" fill="rgba(0,0,0,0)"/>
            <text aria-hidden="true" x="{{ ПозицияЗначения }}" y="150" fill="#fff" transform="scale(.1)" textLength="{{ ШиринаТекстаЗначения }}">{{ Значение }}</text>
            <text id="rlink" x="{{ ПозицияЗначения }}" y="140" transform="scale(.1)" textLength="{{ ШиринаТекстаЗначения }}">{{ Значение }}</text>
        </a>
    </g>
</svg>