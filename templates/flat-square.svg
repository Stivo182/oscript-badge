<svg
	xmlns="http://www.w3.org/2000/svg" width="{{ Ширина }}" height="20" role="img" aria-label="{{ Подсказка }}">
	<title>{{ Подсказка }}</title>
	<g shape-rendering="crispEdges">
		<rect width="{{ ПозицияРазделения }}" height="20" fill="{{ ЦветФонаЗаголовка }}"/>
		<rect x="{{ ПозицияРазделения }}" width="{{ ШиринаЗначения }}" height="20" fill="{{ ЦветФонаЗначения }}"/>
	</g>
	<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="{{ РазмерШрифта }}">
		<image x="5" y="3" width="14" height="14" href="{{ Логотип }}"/>
		<text x="{{ ПозицияЗаголовка }}" y="140" transform="scale(.1)" fill="{{ ЦветТекстаЗаголовка }}" textLength="{{ ДлинаТекстаЗаголовка }}">{{ Заголовок }}</text>
		<text x="{{ ПозицияЗначения }}" y="140" transform="scale(.1)" fill="{{ ЦветТекстаЗначения }}" textLength="{{ ДлинаТекстаЗначения }}">{{ Значение }}</text>
	</g>
</svg>