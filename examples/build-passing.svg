<svg
    xmlns="http://www.w3.org/2000/svg" width="95" height="20" role="img" aria-label="build: passing">
    <title>build: passing</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="95" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect fill="#555" width="40" height="20"/>
        <rect fill="#4c1" x="40" width="55" height="20"/>
        <rect fill="url(#s)" width="95" height="20"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
        <image x="5" y="3" width="14" height="14" href=""/>
        <text aria-hidden="true" x="200" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="300">build</text>
        <text x="200" y="140" fill="#fff" transform="scale(.1)" textLength="300">build</text>
        <text aria-hidden="true" x="675" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="450">passing</text>
        <text x="675" y="140" fill="#fff" transform="scale(.1)" textLength="450">passing</text>
    </g>
</svg>