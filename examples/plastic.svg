<svg
    xmlns="http://www.w3.org/2000/svg" width="109" height="18" role="img" aria-label="downloads: 10k+">
    <title>downloads: 10k+</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
        <stop offset=".1" stop-color="#aaa" stop-opacity=".1"/>
        <stop offset=".9" stop-color="#000" stop-opacity=".3"/>
        <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="109" height="18" rx="4" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect width="70" height="18" fill="#555"/>
        <rect x="70" width="39" height="18" fill="orange"/>
        <rect width="109" height="18" fill="url(#s)"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
        <image x="5" y="2" width="14" height="14" href=""/>
        <text aria-hidden="true" x="350" y="140" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="600">downloads</text>
        <text x="350" y="130" transform="scale(.1)" fill="#fff" textLength="600">downloads</text>
        <text aria-hidden="true" x="895" y="140" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="290">10k+</text>
        <text x="895" y="130" transform="scale(.1)" fill="#fff" textLength="290">10k+</text>
    </g>
</svg>