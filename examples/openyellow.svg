<svg
    xmlns="http://www.w3.org/2000/svg" width="149" height="20" role="img" aria-label="OpenYellow: Ranked">
    <title>OpenYellow: Ranked</title>
    <linearGradient id="s" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
        <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="r">
        <rect width="149" height="20" rx="3" fill="#fff"/>
    </clipPath>
    <g clip-path="url(#r)">
        <rect fill="#555" width="97" height="20"/>
        <rect fill="#dfb317" x="97" width="52" height="20"/>
        <rect fill="url(#s)" width="149" height="20"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
        <image x="5" y="3" width="14" height="14" href="data:image/svg+xml;base64,"/>
        <text aria-hidden="true" x="580" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="680">OpenYellow</text>
        <text x="580" y="140" fill="#fff" transform="scale(.1)" textLength="680">OpenYellow</text>
        <text aria-hidden="true" x="1230" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="420">Ranked</text>
        <text x="1230" y="140" fill="#fff" transform="scale(.1)" textLength="420">Ranked</text>
    </g>
</svg>